name: gahookz

services:
  gahookz-dev:
    image: gahookz:dev
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    init: true
    restart: unless-stopped
    stop_grace_period: 15s
    environment:
      NODE_ENV: development
      PORT: "3001"
      HOST: "0.0.0.0"
      GAHOOKZ_TRUST_PROXY: "${GAHOOKZ_TRUST_PROXY:-0}"
      GAHOOKZ_HTTPS: "${GAHOOKZ_HTTPS:-0}"
      GAHOOKZ_PUBLIC_ORIGIN: "${GAHOOKZ_PUBLIC_ORIGIN:-}"
      DATABASE_URL: "${GAHOOKZ_DATABASE_URL:-}"
      GAHOOKZ_DATABASE_SSL: "${GAHOOKZ_DATABASE_SSL:-0}"
      GAHOOKZ_AUTO_MIGRATE: "${GAHOOKZ_AUTO_MIGRATE:-1}"
      GAHOOKZ_REQUIRE_POSTGRES: "${GAHOOKZ_REQUIRE_POSTGRES:-0}"
      GAHOOKZ_INSTANCE_ID: "${GAHOOKZ_DEV_INSTANCE_ID:-dev-1}"
      GAHOOKZ_METRICS_TOKEN: "${GAHOOKZ_METRICS_TOKEN:-}"
      GOOGLE_CLIENT_ID: "${GOOGLE_CLIENT_ID:-}"
      GOOGLE_CLIENT_SECRET: "${GOOGLE_CLIENT_SECRET:-}"
      NODE_OPTIONS: "--max-old-space-size=${GAHOOKZ_NODE_MEMORY_MB:-768}"
    ports:
      - "${GAHOOKZ_BIND_ADDRESS:-127.0.0.1}:${GAHOOKZ_DEV_PORT:-3101}:3001"
    networks:
      - default
      - proxy
    volumes:
      - ./standalone:/app/standalone:z
      - ./packages:/app/packages:ro,z
      - ./infra:/app/infra:ro,z
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 128
    mem_limit: "${GAHOOKZ_MEMORY_LIMIT:-1g}"
    cpus: "${GAHOOKZ_CPU_LIMIT:-2.0}"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  gahookz:
    image: gahookz:local
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    init: true
    restart: unless-stopped
    stop_grace_period: 15s
    environment:
      NODE_ENV: production
      PORT: "3001"
      HOST: "0.0.0.0"
      GAHOOKZ_TRUST_PROXY: "${GAHOOKZ_TRUST_PROXY:-1}"
      GAHOOKZ_HTTPS: "${GAHOOKZ_HTTPS:-1}"
      GAHOOKZ_PUBLIC_ORIGIN: "${GAHOOKZ_PUBLIC_ORIGIN:-}"
      DATABASE_URL: "${GAHOOKZ_DATABASE_URL:-}"
      GAHOOKZ_DATABASE_SSL: "${GAHOOKZ_DATABASE_SSL:-0}"
      GAHOOKZ_AUTO_MIGRATE: "${GAHOOKZ_AUTO_MIGRATE:-1}"
      GAHOOKZ_REQUIRE_POSTGRES: "${GAHOOKZ_REQUIRE_POSTGRES:-0}"
      GAHOOKZ_INSTANCE_ID: "${GAHOOKZ_PROD_INSTANCE_ID:-prod-1}"
      GAHOOKZ_METRICS_TOKEN: "${GAHOOKZ_METRICS_TOKEN:-}"
      GOOGLE_CLIENT_ID: "${GOOGLE_CLIENT_ID:-}"
      GOOGLE_CLIENT_SECRET: "${GOOGLE_CLIENT_SECRET:-}"
      NODE_OPTIONS: "--max-old-space-size=${GAHOOKZ_NODE_MEMORY_MB:-768}"
    ports:
      - "${GAHOOKZ_BIND_ADDRESS:-127.0.0.1}:${GAHOOKZ_PROD_PORT:-3102}:3001"
    networks:
      - default
      - proxy
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 128
    mem_limit: "${GAHOOKZ_MEMORY_LIMIT:-1g}"
    cpus: "${GAHOOKZ_CPU_LIMIT:-2.0}"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  proxy:
    name: gahookz-proxy
    external: true
